[project]
name = "mlbb-pipeline"
version = "0.1.0"
description = "Build-time pipeline: Liquipedia wikitext -> SQLite -> JSON for MLBB Analytics"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mlbb-backfill = "mlbb_pipeline.backfill:main"
mlbb-build = "mlbb_pipeline.build:main"
mlbb-gen-types = "mlbb_pipeline.gen_ts:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbb_pipeline"]

[dependency-groups]
dev = ["pytest>=8.0"]
